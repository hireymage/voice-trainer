# voice-trainer konfigurace — zkopíruj na ~/voice-trainer/config.yaml a uprav.
# Žádné IP/porty v kódu — vše se čte odsud.

# ── cesty ────────────────────────────────────────────────────────────────────
# data_root: dataset + tréninky + venvy (velké → HDD)
data_root: /mnt/models/voice-trainer
# repo_dir: kód (malé → home)
repo_dir: /home/user/voice-trainer

# ── STT (whisper.cpp server) ─────────────────────────────────────────────────
stt_url: http://localhost:8082/inference
stt_language: cs
stt_timeout: 300          # cold-start gate může blokovat až 120 s
stt_retries: 2

# ── API pro klientské aplikace (nastav adresu soukromé sítě, např. ZeroTier) ─
api_host: 127.0.0.1
api_port: 8097

# ── LLM pro generování vět (ollama) ──────────────────────────────────────────
llm_url: http://localhost:11434
llm_model: glm-5.3-flash:cloud
llm_batch_size: 10        # kolik vět vygenerovat najednou
llm_timeout: 120

# ── nahrávání ────────────────────────────────────────────────────────────────
recording:
  sample_rate: 48000      # raw nahrávka na klientovi (mono)
  stt_sample_rate: 16000  # dočasná kopie pro whisper
  max_seconds: 120
  similarity_threshold: 0.90   # 90 % podobnosti STT vs. předloha = PASS

# ── trénink (piper1-gpl) ─────────────────────────────────────────────────────
training:
  # sample_rate se čte z base checkpoint configu; fallback pro první ukládání:
  fallback_sample_rate: 22050
  highpass_hz: 80         # filtr hučení pozadí při přípravě dat; master zůstává surový (0 = vypnuto)
  espeak_voice: cs
  devices: 2              # 2× GTX 1080 Ti (DDP)
  strategy: ddp
  batch_size: 8           # per GPU; Pascal 11 GB
  precision: "32-true"    # Pascal nemá efektivní bf16; fp16 amp volitelně
  max_epochs: 500
  val_ratio: 0.02         # část datasetu pro validaci (min 1 nahrávka)
  # base checkpoint jirka-medium (stahuje fáze 4 setup, Hugging Face)
  base_checkpoint: /mnt/models/voice-trainer/piper1-gpl/jirka-medium.ckpt
  base_config: /mnt/models/voice-trainer/piper1-gpl/jirka-medium-config.json
  piper_repo: /mnt/models/voice-trainer/piper1-gpl/repo
  piper_venv: /mnt/models/voice-trainer/venv-piper

# ── GPU lanes, které musí trénink stopnout (NOPASSWD sudo units) ─────────────
gpu_lane_units:
  - llama-server.service
  - llama-server-b.service
  - llama-server-bonsai0.service
  - llama-server-bonsai1.service

# ── quality ──────────────────────────────────────────────────────────────────
quality:
  min_duration: 1.0       # s
  max_duration: 30.0      # s
  clip_peak: 0.99
  clip_count: 20          # počet sampleů >= clip_peak → REVIEW
  quiet_rms_db: -35.0
  loud_rms_db: -10.0